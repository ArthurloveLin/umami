name: Build and publish container

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional image version (e.g. 3.0.0, v3.0.0, or 3.0.0-beta.1)"
        required: false
        default: ""
      include_latest:
        description: "Include latest tag"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tags
        id: compute
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_INCLUDE_LATEST: ${{ github.event.inputs.include_latest }}
        run: |
          ref_type="${GITHUB_REF_TYPE:-}"
          ref_name="${GITHUB_REF_NAME:-}"
          version="${INPUT_VERSION#v}"
          include_latest="${INPUT_INCLUDE_LATEST:-true}"
          short_sha="${GITHUB_SHA::12}"
          tags=()

          add_version_tags() {
            local value="$1"
            local major="${value%%.*}"
            local rest="${value#*.}"
            local minor="${rest%%.*}"

            tags+=("${IMAGE_NAME}:${value}")

            if [[ "$value" != *-* ]]; then
              tags+=("${IMAGE_NAME}:${major}.${minor}")
              tags+=("${IMAGE_NAME}:${major}")
              tags+=("${IMAGE_NAME}:postgresql-latest")

              if [[ "$include_latest" == "true" ]]; then
                tags+=("${IMAGE_NAME}:latest")
              fi
            fi
          }

          if [[ -n "$version" ]]; then
            add_version_tags "$version"
          elif [[ "$ref_type" == "tag" ]]; then
            add_version_tags "${ref_name#v}"
          else
            tags+=("${IMAGE_NAME}:${ref_name}")
            tags+=("${IMAGE_NAME}:sha-${short_sha}")

            if [[ "$ref_name" == "master" ]]; then
              tags+=("${IMAGE_NAME}:latest")
              tags+=("${IMAGE_NAME}:postgresql-latest")
            fi
          fi

          {
            echo 'ghcr_tags<<EOF'
            printf '%s\n' "${tags[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          printf 'Computed GHCR tags:\n%s\n' "${tags[@]}"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.compute.outputs.ghcr_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max