name: CI/CD

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional image version (e.g. 3.0.0, v3.0.0, or 3.0.0-beta.1)"
        required: false
        default: ""
      include_latest:
        description: "Include latest tag"
        required: false
        type: boolean
        default: true

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
  SKIP_DB_CHECK: 1

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm --allow-build=@parcel/watcher --allow-build=@prisma/engines --allow-build=@swc/core --allow-build=cypress --allow-build=esbuild --allow-build=prisma --allow-build=sharp install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  cd:
    name: Build and publish GHCR image
    needs: ci
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' &&
      (github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tags
        id: compute
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_INCLUDE_LATEST: ${{ github.event.inputs.include_latest }}
        run: |
          ref_type="${GITHUB_REF_TYPE:-}"
          ref_name="${GITHUB_REF_NAME:-}"
          version="${INPUT_VERSION#v}"
          include_latest="${INPUT_INCLUDE_LATEST:-true}"
          short_sha="${GITHUB_SHA::12}"
          tags=()

          add_version_tags() {
            local value="$1"
            local major="${value%%.*}"
            local rest="${value#*.}"
            local minor="${rest%%.*}"

            tags+=("${IMAGE_NAME}:${value}")

            if [[ "$value" != *-* ]]; then
              tags+=("${IMAGE_NAME}:${major}.${minor}")
              tags+=("${IMAGE_NAME}:${major}")
              tags+=("${IMAGE_NAME}:postgresql-latest")

              if [[ "$include_latest" == "true" ]]; then
                tags+=("${IMAGE_NAME}:latest")
              fi
            fi
          }

          if [[ -n "$version" ]]; then
            add_version_tags "$version"
          elif [[ "$ref_type" == "tag" ]]; then
            add_version_tags "${ref_name#v}"
          else
            tags+=("${IMAGE_NAME}:${ref_name}")
            tags+=("${IMAGE_NAME}:sha-${short_sha}")

            if [[ "$ref_name" == "master" ]]; then
              tags+=("${IMAGE_NAME}:latest")
              tags+=("${IMAGE_NAME}:postgresql-latest")
            fi
          fi

          {
            echo 'ghcr_tags<<EOF'
            printf '%s\n' "${tags[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          printf 'Computed GHCR tags:\n%s\n' "${tags[@]}"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.compute.outputs.ghcr_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

